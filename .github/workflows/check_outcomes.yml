name: Machine 001 Check Outcomes

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run outcome check
        run: python3 src/radar/check_outcomes.py

      - name: Commit updated database
        run: |
          git config user.name "machine-001-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/radar.db
          git diff --staged --quiet || git commit -m "Outcome check $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
