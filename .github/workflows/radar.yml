name: Machine 001 Radar Scan

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run radar scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 src/radar/scan.py

      - name: Run whale watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: python3 src/radar/whale_transfers.py

      - name: Run paper trading
        run: python3 src/radar/paper_trading.py

      - name: Commit updated database
        run: |
          git config user.name "machine-001-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 src/radar/generate_dashboard.py
          git add -f data/radar.db docs/index.html
          git diff --staged --quiet || git commit -m "Radar + whale scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
