name: Machine 001 Radar Scan

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run radar scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 src/radar/scan.py

      - name: Commit updated database
        run: |
          git config user.name "machine-001-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/radar.db
          git diff --staged --quiet || git commit -m "Radar scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
